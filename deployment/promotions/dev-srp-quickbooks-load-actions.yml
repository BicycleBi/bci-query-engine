schema_version: 1
client: srp
environment: dev
source_repo: .
source_commit: HEAD

targets:
  stack_dir: /home/shared/bci-clients/srpdev
  compose_project: srpdev

runtime_config:
  services:
    query-engine:
      env:
        DATA_LOAD_ACTION_WORKER_ENABLED: "true"
        DATA_LOAD_ACTION_POLL_SECONDS: "1"
        DATA_LOAD_ACTION_LEASE_SECONDS: "7200"
        QUICKBOOKS_LOAD_CONTROL_ROLES: "srpdev_bicycle_dev"
        QUICKBOOKS_FULL_LOAD_URL: "http://data-integration:8080/loads/srp-quickbooks-loader/run"
        QUICKBOOKS_FULL_LOAD_TIMEOUT_SECONDS: "5400"
      container_env:
        DATA_LOAD_ACTION_WORKER_ENABLED: "true"
        DATA_LOAD_ACTION_POLL_SECONDS: "1"
        DATA_LOAD_ACTION_LEASE_SECONDS: "7200"
        QUICKBOOKS_LOAD_CONTROL_ROLES: "srpdev_bicycle_dev"
        QUICKBOOKS_FULL_LOAD_URL: "http://data-integration:8080/loads/srp-quickbooks-loader/run"
        QUICKBOOKS_FULL_LOAD_TIMEOUT_SECONDS: "5400"
      reconcile: recreate-if-env-changed

service_runtime:
  promote:
    source: .
    service: query-engine
    build_context_env_var: QUERY_ENGINE_BUILD_CONTEXT
    purpose: SRP Dev authenticated durable QuickBooks-only full-load actions

validate:
  - type: compose-config
  - type: service-health
    service: query-engine
  - type: service-env
    service: query-engine
    env:
      DATA_LOAD_ACTION_WORKER_ENABLED: "true"
      DATA_LOAD_ACTION_POLL_SECONDS: "1"
      DATA_LOAD_ACTION_LEASE_SECONDS: "7200"
      QUICKBOOKS_LOAD_CONTROL_ROLES: "srpdev_bicycle_dev"
      QUICKBOOKS_FULL_LOAD_URL: "http://data-integration:8080/loads/srp-quickbooks-loader/run"
      QUICKBOOKS_FULL_LOAD_TIMEOUT_SECONDS: "5400"
