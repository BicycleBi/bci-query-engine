schema_version: 1
client: rf
environment: dev
source_repo: .
source_commit: HEAD

targets:
  stack_dir: /home/shared/bci-clients/rfdev
  compose_project: rfdev

runtime_config:
  services:
    query-engine:
      env:
        REDIS_ENABLED: "true"
      container_env:
        REDIS_ENABLED: "true"
      reconcile: recreate-if-env-changed

service_runtime:
  promote:
    source: .
    service: query-engine
    build_context_env_var: QUERY_ENGINE_BUILD_CONTEXT
    purpose: RFDev authenticated FDH history query execution and Redis response caching

validate:
  - type: compose-config
  - type: service-health
    service: query-engine
  - type: service-env
    service: query-engine
    env:
      REDIS_ENABLED: "true"
